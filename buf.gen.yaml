version: v2
plugins:
  - local: protoc-gen-go
    out: api
    opt:
      - paths=source_relative

  # Connect stubs for the Admin service. Connect serves the gRPC
  # protocol natively, so the admin listener stays reachable from
  # grpcurl and gRPC clients without Go gRPC stubs. The tunnel itself
  # is a WebSocket and needs no service stubs at all.
  - local: protoc-gen-connect-go
    out: api
    opt:
      - paths=source_relative
