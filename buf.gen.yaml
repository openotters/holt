version: v2
plugins:
  - local: protoc-gen-go
    out: api
    opt:
      - paths=source_relative

  # gRPC stubs: the dial side attaches via a plain gRPC client so it
  # can ride an application's existing *grpc.ClientConn.
  - local: protoc-gen-go-grpc
    out: api
    opt:
      - paths=source_relative

  # Connect stubs: the hub side serves Attach from a Connect mux so
  # it inherits whatever auth middleware the application mounts.
  - local: protoc-gen-connect-go
    out: api
    opt:
      - paths=source_relative
