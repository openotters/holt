syntax = "proto3";

package openotters.holt.v1;

option go_package = "github.com/openotters/holt/api/v1;holtv1";

// Admin is the hub's management surface: enumerate live tunnels and
// force one closed. It reflects the hub Registry over the wire so a
// CLI (or grpcurl) can operate a hub remotely. Mount it behind
// whatever operator auth the deployment uses.
service Admin {
  rpc ListTunnels(ListTunnelsRequest) returns (ListTunnelsResponse);
  rpc StopTunnel(StopTunnelRequest) returns (StopTunnelResponse);
  // BlockPeer stops a peer's tunnel AND bans its peer id, so it cannot
  // reconnect even with a valid token — versus StopTunnel's plain
  // disconnect. The ban is on the identity, not one specific token:
  // every token whose subject is that id (including ones minted while
  // blocked) is refused until UnblockPeer. Requires the hub to have a
  // blocker configured; otherwise returns Unimplemented.
  rpc BlockPeer(BlockPeerRequest) returns (BlockPeerResponse);
  // UnblockPeer lifts a BlockPeer ban so the peer may reconnect. Tokens
  // minted before the block that have not expired become valid again;
  // blocking never invalidates the tokens themselves.
  rpc UnblockPeer(UnblockPeerRequest) returns (UnblockPeerResponse);
  // ListBlocked returns the currently-blocked peers (which have no
  // live tunnel to appear in ListTunnels). Empty when no blocker is
  // configured.
  rpc ListBlocked(ListBlockedRequest) returns (ListBlockedResponse);
  // WatchTunnels streams the live-tunnel set: an empty hello event
  // first (KIND_UNSPECIFIED, flushes headers so browser clients see
  // the subscription immediately), then the current tunnels as
  // ATTACHED events (a snapshot), then attach/detach events as they
  // happen. An ATTACHED for a peer already seen is a
  // harmless duplicate (subscribe and snapshot overlap by design so
  // nothing falls in the gap). The stream ends server-side if the
  // client falls too far behind; resubscribe and treat the replay as
  // a fresh snapshot.
  rpc WatchTunnels(WatchTunnelsRequest) returns (stream TunnelEvent);
  // WatchRequests streams the requests the hub's proxy carried, as
  // each response completes, for one peer or for all of them. Nothing
  // is stored: a subscriber gets the few the hub still holds in memory
  // (gone on restart), then what happens next. Events are dropped
  // rather than slowing a request when a client cannot keep up.
  rpc WatchRequests(WatchRequestsRequest) returns (stream RequestEvent);
  // Info reports a snapshot of the hub: build version, live counts, and
  // the addresses an operator needs (advertise, proxy, metrics). It is
  // what `holt info` prints.
  rpc Info(InfoRequest) returns (InfoResponse);
}

message TunnelInfo {
  string peer             = 1;
  string peer_version     = 2;
  int64  attached_at_unix = 3;
  // What the peer said it carries: "http", "https", or "" from a peer
  // older than the field.
  string tunnel_type      = 4;
}

message ListTunnelsRequest {}

message ListTunnelsResponse {
  repeated TunnelInfo tunnels = 1;
}

message StopTunnelRequest {
  string peer   = 1;
  string reason = 2; // GoAway reason sent to the peer; default "stopped-by-operator"
}

message StopTunnelResponse {
  bool stopped = 1; // false when no tunnel was attached for that peer
}

message BlockPeerRequest {
  string peer = 1;
}

message BlockPeerResponse {
  bool stopped = 1; // whether a live tunnel was also closed
}

message UnblockPeerRequest {
  string peer = 1;
}

message UnblockPeerResponse {}

message BlockedPeer {
  string peer            = 1;
  int64  blocked_at_unix = 2;
}

message ListBlockedRequest {}

message ListBlockedResponse {
  repeated BlockedPeer peers = 1;
}

message WatchTunnelsRequest {}

message TunnelEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ATTACHED    = 1;
    KIND_DETACHED    = 2;
  }
  Kind       kind   = 1;
  TunnelInfo info   = 2; // fully set on ATTACHED; only peer on DETACHED
  string     reason = 3; // detach reason, empty on ATTACHED
}

message WatchRequestsRequest {
  // Only this peer's requests. Empty streams every peer's, which a
  // hub carrying a fleet can make a lot of: a client watching one
  // peer should say so and let the hub do the filtering.
  string peer = 1;
}

// RequestEvent is one request the hub proxied to a peer, reported once
// its response completed.
message RequestEvent {
  string peer          = 1;
  string method        = 2;
  string path          = 3;
  int32  status        = 4; // 0 when the request never got a response
  int64  duration_us   = 5; // microseconds, hub side, tunnel hop included
  int64  at_unix_millis = 6;
}

message InfoRequest {}

message InfoResponse {
  string version           = 1;
  string commit            = 2;
  int64  tunnels           = 3;  // live tunnels on this hub
  int64  blocked           = 4;  // banned peer ids
  string advertise_addr    = 5;  // tunnel address stamped into tokens
  string proxy_addr        = 6;  // header-routed proxy
  string route_header      = 7;  // header naming the target peer
  string metrics_addr      = 8;  // empty when metrics are off
  string external_url      = 9;  // public proxy URL, if set
  int64  token_ttl_seconds = 10; // lifetime of minted tokens
  // How the proxy picks the target peer: "header", "subdomain", or
  // "both". Empty from a hub older than the strategy flag, which
  // always meant header.
  string proxy_routing     = 11;
  // Base domain for subdomain routing (<peer>.<domain>), empty when
  // subdomain routing is off.
  string proxy_domain      = 12;
}
