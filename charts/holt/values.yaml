# Default values for the holt chart.

image:
  repository: ghcr.io/openotters/holt
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The hub is a single replica on purpose: the JWT secret, blocklist,
# and live tunnels are process-local. The tunnel-presence directory
# can move to a shared PostgreSQL (see `postgres` below) so several
# hub releases see each other's peers; each release still runs one
# replica.
hub:
  # Serve the web console on the admin port.
  ui: true
  # Lifetime of JWTs minted by enroll.
  tokenTTL: 24h
  # Public tunnel URL stamped into join tokens (what peers dial). The
  # pod binds 0.0.0.0, which peers cannot dial, so set this to the
  # reachable URL. The scheme picks the peer transport:
  # "https://holt.example.com" dials TLS through a TLS edge (ingress,
  # LoadBalancer with TLS, or Cloudflare, verified with the system
  # roots), "http://192.168.8.193:7000" dials plaintext h2c to a bare
  # LoadBalancer IP. Empty falls back to http://<bind address>.
  advertiseAddr: ""
  # Log level (debug, info, warn, error). Logs are always JSON here;
  # this is a server.
  logLevel: info
  # Extra Host header values the admin/console accept, on top of the
  # in-cluster names (loopback and the service name). The chart already
  # adds the admin ingress host automatically, so you only need this
  # for additional public hostnames. Use ["*"] to disable the DNS
  # rebinding guard entirely (not recommended).
  allowedHosts: []
  # Cap concurrent tunnel connections (0 = unlimited).
  maxConns: 0
  # Public base URL the proxy is reachable at, shown in the console's
  # "Call" command. Leave empty to auto-derive https://<proxy ingress
  # host> when the proxy ingress is enabled.
  externalURL: ""

# Shared tunnel-presence directory in PostgreSQL (optional). Off by
# default: presence then lives in the hub's local SQLite state. Set
# exactly ONE of the three sources below; each ends up as the
# HOLT_DIRECTORY_DSN env var (the hub's --directory-dsn flag). The JWT
# secret and blocklist stay on the state volume either way.
postgres:
  # Inline DSN (e.g. postgres://user:pass@host:5432/holt). Convenient
  # for dev; prefer existingSecret so the password stays out of values.
  dsn: ""
  # Read the DSN from a key of an existing Secret — e.g. one your
  # PostgreSQL operator generates.
  existingSecret:
    name: ""
    key: "uri"
  # Provision a CloudNativePG Cluster (postgresql.cnpg.io/v1) named
  # "<fullname>-db" and wire the hub to the operator-generated
  # "<fullname>-db-app" Secret's uri. Requires the CNPG operator
  # (https://cloudnative-pg.io) and its CRDs in the cluster.
  cnpg:
    enabled: false
    instances: 1
    storage:
      size: 1Gi
      storageClass: ""
    # Extra fields merged verbatim into the Cluster spec (imageName,
    # postgresql.parameters, backup, resources, ...).
    extraSpec: {}

# Prometheus metrics (/metrics): the hub exposes tunnel counters via an
# OTel Prometheus exporter.
metrics:
  enabled: false
  port: 7003
  # A Prometheus Operator ServiceMonitor to scrape /metrics. Needs the
  # ServiceMonitor CRD (kube-prometheus-stack); enable metrics too.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels for the ServiceMonitor (e.g. release: kube-prometheus-stack
    # so your Prometheus selects it).
    labels: {}

service:
  # Tunnel listener: peers dial this from OUTSIDE the cluster, so it
  # usually needs to be reachable publicly (a LoadBalancer or an
  # ingress). The listener is plaintext h2c; transport encryption is
  # the deployment's job, so terminate TLS at a LoadBalancer, ingress,
  # or Cloudflare edge in front and advertise its https:// URL.
  tunnel:
    type: LoadBalancer
    port: 7000
    # Set when peers reach the hub through a fixed address; used only
    # for documentation in NOTES.txt.
    annotations: {}
  # Admin API + web console: keep it private (port-forward or an
  # authenticated ingress).
  admin:
    type: ClusterIP
    port: 7001
  # Header-routed proxy (x-tunnel-peer) to reach peer services.
  proxy:
    type: ClusterIP
    port: 7002

# Ingresses are DISABLED by default and should stay that way unless an
# authenticating layer sits in front. The admin API mints join tokens
# and can kill/block peers, and the proxy reaches every peer's service;
# neither has built-in auth. The intended exposure is behind a zero
# trust proxy (e.g. Cloudflare Tunnel + Access) or an authenticating
# ingress, NOT a bare public ingress. When you do enable the admin
# ingress, its host is added to hub.allowedHosts automatically so the
# console keeps working while staying DNS-rebinding safe.
ingress:
  admin:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []
  proxy:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []

persistence:
  # The hub state: JWT secret, blocklist, presence.
  # Losing it invalidates every join token already handed out.
  enabled: true
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  # Use an existing claim instead of creating one.
  existingClaim: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Liveness/readiness probes. Default to an HTTP GET of /healthz on the
# admin port. Set a full probe spec here to override either one.
livenessProbe: {}
readinessProbe: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # Makes the state volume writable by the non-root user.
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
