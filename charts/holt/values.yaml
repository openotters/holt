# Default values for the holt chart.

image:
  repository: ghcr.io/openotters/holt
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The hub is a single replica by default: live tunnels are
# process-local, and so is the state on its volume. With a shared
# PostgreSQL (see `postgres` below) presence, the denylist, and the
# JWT signing secret all move to the database, so several hubs verify
# each other's tokens and persistence can be turned off entirely.
hub:
  # Serve the web console on the admin port.
  ui: true
  # Lifetime of JWTs minted by enroll.
  tokenTTL: 24h
  # Recent proxied requests kept in memory to seed the console's
  # traffic view. Nothing is written anywhere and the window dies with
  # the pod; 0 keeps none, so a panel shows only what happens after it
  # opens.
  trafficBuffer: 100
  # Public tunnel URL stamped into join tokens (what peers dial). The
  # pod binds 0.0.0.0, which peers cannot dial, so set this to the
  # reachable URL. The scheme picks the peer transport:
  # "wss://holt.example.com" dials TLS under the WebSocket through a
  # TLS edge (ingress, LoadBalancer with TLS, or Cloudflare, verified
  # with the system roots), "ws://192.168.8.193:7200" dials plaintext
  # to a bare LoadBalancer IP (https/http accepted as aliases). Empty
  # falls back to ws://<bind address>.
  advertiseAddr: ""
  # Log level (debug, info, warn, error). Logs are always JSON here;
  # this is a server.
  logLevel: info
  # Extra Host header values the admin/console accept, on top of the
  # in-cluster names (loopback and the service name). The chart already
  # adds the admin ingress host automatically, so you only need this
  # for additional public hostnames. Use ["*"] to disable the DNS
  # rebinding guard entirely (not recommended).
  allowedHosts: []
  # Cap concurrent tunnel connections (0 = unlimited).
  maxConns: 0
  # Public base URL the proxy is reachable at, shown in the console's
  # "Call" command. Leave empty to auto-derive https://<proxy ingress
  # host> when the proxy ingress is enabled.
  externalURL: ""
  # How the proxy picks the target peer:
  #   header    the x-tunnel-peer header (default, needs no DNS)
  #   subdomain <peer>.<proxyDomain>, so every peer gets its own
  #             hostname that any client can use (browsers, webhooks,
  #             anything that only takes a URL)
  #   both      header first, subdomain as the fallback
  # subdomain and both require proxyDomain, and a wildcard DNS record
  # plus a wildcard certificate at the edge (set the proxy ingress
  # host to the matching wildcard). A wildcard certificate matches one
  # label only, so prefer a first-level domain here ("example.com",
  # covered by "*.example.com"); a deeper "peers.example.com" needs a
  # certificate that explicitly includes "*.peers.example.com", which
  # Cloudflare's free Universal SSL does NOT.
  proxyRouting: header
  proxyDomain: ""

# Shared tunnel-presence directory in PostgreSQL (optional). Off by
# default: presence then lives in the hub's local SQLite state. Set
# exactly ONE of the three sources below; each ends up as the
# HOLT_DIRECTORY_DSN env var (the hub's --directory-dsn flag). The JWT
# secret and blocklist stay on the state volume either way.
postgres:
  # Inline DSN (e.g. postgres://user:pass@host:5432/holt). Convenient
  # for dev; prefer existingSecret so the password stays out of values.
  dsn: ""
  # Read the DSN from a key of an existing Secret — e.g. one your
  # PostgreSQL operator generates.
  existingSecret:
    name: ""
    key: "uri"
  # Provision a CloudNativePG Cluster (postgresql.cnpg.io/v1) named
  # "<fullname>-db" and wire the hub to the operator-generated
  # "<fullname>-db-app" Secret's uri. Requires the CNPG operator
  # (https://cloudnative-pg.io) and its CRDs in the cluster.
  cnpg:
    enabled: false
    instances: 1
    storage:
      size: 1Gi
      storageClass: ""
    # Extra fields merged verbatim into the Cluster spec (imageName,
    # postgresql.parameters, backup, resources, ...).
    extraSpec: {}

# Prometheus metrics (/metrics): the hub exposes tunnel counters via an
# OTel Prometheus exporter.
metrics:
  enabled: false
  port: 7203
  # A Prometheus Operator ServiceMonitor to scrape /metrics. Needs the
  # ServiceMonitor CRD (kube-prometheus-stack); enable metrics too.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels for the ServiceMonitor (e.g. release: kube-prometheus-stack
    # so your Prometheus selects it).
    labels: {}
  # A ready-made Grafana dashboard for the metrics above (attached
  # peers, attach/detach reasons, proxy rate, latency, errors).
  dashboard:
    enabled: false
    # How Grafana gets it:
    #   sidecar   a ConfigMap labelled for the Grafana sidecar, the
    #             kube-prometheus-stack way (no CRD needed)
    #   operator  a GrafanaDashboard (grafana.integreatly.org/v1beta1)
    #             for grafana-operator v5
    mode: sidecar
    # The folder Grafana files it under, in either mode.
    folder: holt
    labels: {}
    annotations: {}
    # sidecar mode: the label the Grafana sidecar watches for.
    sidecarLabel: grafana_dashboard
    sidecarLabelValue: "1"
    # operator mode: which Grafana instances get it.
    instanceSelector:
      matchLabels:
        dashboards: grafana
    allowCrossNamespaceImport: false
    resyncPeriod: 5m

service:
  # Tunnel listener: peers dial this from OUTSIDE the cluster, so it
  # usually needs to be reachable publicly (a LoadBalancer or an
  # ingress). The listener is a plaintext WebSocket endpoint;
  # transport encryption is the deployment's job, so terminate TLS at
  # a LoadBalancer, ingress, or Cloudflare edge in front and advertise
  # its wss:// URL.
  tunnel:
    type: LoadBalancer
    port: 7200
    # Set when peers reach the hub through a fixed address; used only
    # for documentation in NOTES.txt.
    annotations: {}
  # Admin API + web console: keep it private (port-forward or an
  # authenticated ingress).
  admin:
    type: ClusterIP
    port: 7201
  # Header-routed proxy (x-tunnel-peer) to reach peer services.
  proxy:
    type: ClusterIP
    port: 7202

# Ingresses are DISABLED by default. Admin and proxy should stay that
# way unless an authenticating layer sits in front: the admin API mints
# join tokens and can kill/block peers, and the proxy reaches every
# peer's service; neither has built-in auth. The intended exposure is
# behind a zero trust proxy (e.g. Cloudflare Tunnel + Access) or an
# authenticating ingress, NOT a bare public ingress. When you do enable
# the admin ingress, its host is added to hub.allowedHosts automatically
# so the console keeps working while staying DNS-rebinding safe.
#
# The tunnel ingress is different: that listener is JWT-authenticated
# and exists to be dialed from outside, so exposing it is the point.
# The tunnel is a WebSocket, so any edge forwarding plain HTTP/1.1
# upgrades carries it (Cloudflare public hostnames included). Do NOT
# enable an HTTP/2-to-origin setting on this hostname (e.g. the
# cloudflare-tunnel http2-origin annotation); an HTTP/2 origin
# connection breaks the upgrade. When enabled, its host is advertised
# to peers automatically unless hub.advertiseAddr overrides it.
#
# Each listener takes a `path` (default "/", pathType Prefix), so all
# three can share one hostname split by path.
ingress:
  admin:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    path: /
    tls: []
  proxy:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    path: /
    tls: []
  tunnel:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    path: /
    tls: []

persistence:
  # The hub state: JWT secret, blocklist, presence.
  # Losing it invalidates every join token already handed out.
  # Safe to disable when `postgres` is configured: all three live in
  # the database then, and the signing secret no longer regenerates
  # on each restart.
  enabled: true
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  # Use an existing claim instead of creating one.
  existingClaim: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Liveness/readiness probes. Default to an HTTP GET of /healthz on the
# admin port. Set a full probe spec here to override either one.
livenessProbe: {}
readinessProbe: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # Makes the state volume writable by the non-root user.
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
