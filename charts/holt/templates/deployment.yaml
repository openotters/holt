apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "holt.fullname" . }}
  labels:
    {{- include "holt.labels" . | nindent 4 }}
spec:
  # Single replica by design: the hub state is a local SQLite database
  # and live tunnels are process-local. See values.yaml.
  replicas: 1
  strategy:
    # Two hubs must not share the state volume; recreate avoids the
    # rolling overlap.
    type: Recreate
  selector:
    matchLabels:
      {{- include "holt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "holt.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "holt.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: hub
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - hub
            {{- if .Values.hub.ui }}
            - --ui
            {{- end }}
            - --tunnel-addr=0.0.0.0:{{ .Values.service.tunnel.port }}
            - --admin-addr=0.0.0.0:{{ .Values.service.admin.port }}
            - --proxy-addr=0.0.0.0:{{ .Values.service.proxy.port }}
            - --state=/data
            - --token-ttl={{ .Values.hub.tokenTTL }}
            {{- with .Values.hub.advertiseAddr }}
            - --advertise-addr={{ . }}
            {{- end }}
            # In-cluster callers reach the admin service by its name.
            - --allowed-host={{ include "holt.fullname" . }}
            {{- if .Values.ingress.admin.enabled }}
            - --allowed-host={{ required "ingress.admin.host is required when ingress.admin.enabled" .Values.ingress.admin.host }}
            {{- end }}
            {{- range .Values.hub.allowedHosts }}
            - --allowed-host={{ . }}
            {{- end }}
            {{- if gt (int .Values.hub.maxConns) 0 }}
            - --max-conns={{ .Values.hub.maxConns }}
            {{- end }}
            {{- if .Values.hub.externalURL }}
            - --external-url={{ .Values.hub.externalURL }}
            {{- else if .Values.ingress.proxy.enabled }}
            - --external-url=https://{{ required "ingress.proxy.host is required when ingress.proxy.enabled" .Values.ingress.proxy.host }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics
            - --metrics-addr=0.0.0.0:{{ .Values.metrics.port }}
            {{- end }}
          env:
            # Classic structured logs; the friendly output is for
            # terminals.
            - name: HOLT_LOG_FORMAT
              value: json
            - name: LOG_LEVEL
              value: {{ .Values.hub.logLevel | quote }}
          ports:
            - name: tunnel
              containerPort: {{ .Values.service.tunnel.port }}
            - name: admin
              containerPort: {{ .Values.service.admin.port }}
            - name: proxy
              containerPort: {{ .Values.service.proxy.port }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          # Probes hit /healthz on the admin port, not the tunnel port
          # (the tunnel speaks h2c and has no health route). Override the
          # whole block via values.
          readinessProbe:
            {{- if .Values.readinessProbe }}
            {{- toYaml .Values.readinessProbe | nindent 12 }}
            {{- else }}
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
            {{- end }}
          livenessProbe:
            {{- if .Values.livenessProbe }}
            {{- toYaml .Values.livenessProbe | nindent 12 }}
            {{- else }}
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 15
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /data
      volumes:
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "holt.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
