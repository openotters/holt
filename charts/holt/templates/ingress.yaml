{{- range $kind := list "admin" "proxy" "tunnel" }}
{{- $ing := index $.Values.ingress $kind }}
{{- if $ing.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "holt.fullname" $ }}-{{ $kind }}
  labels:
    {{- include "holt.labels" $ | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required (printf "ingress.%s.host is required when ingress.%s.enabled" $kind $kind) $ing.host | quote }}
      http:
        paths:
          - path: {{ $ing.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                {{- if eq $kind "tunnel" }}
                # The tunnel port lives in its own Service; admin and
                # proxy share the main one (see service.yaml).
                name: {{ include "holt.fullname" $ }}-tunnel
                {{- else }}
                name: {{ include "holt.fullname" $ }}
                {{- end }}
                port:
                  name: {{ $kind }}
{{- end }}
{{- end }}
