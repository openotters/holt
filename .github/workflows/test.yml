name: test

# Runs `go build`, `go vet` and `go test -race` on every PR and push
# to main. The e2e test in the root package stands up a real hub and
# peer over loopback, so this exercises the full tunnel path.
on:
  pull_request:
  push:
    branches:
      - main
  # Called by the release workflow, so a tag cannot ship past a
  # failing test.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go: ['1.26']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race ./...
