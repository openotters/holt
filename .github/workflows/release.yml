name: Release

# Fires on semver tag push. Creates a GitHub release with the holt
# binary built for darwin+linux / amd64+arm64, and updates the
# openotters/homebrew-tap formula via goreleaser's brews section.
#
# The tap write uses an **org-owned GitHub App** (not a personal PAT),
# same setup as openotters/openotters. Prereqs:
#   1. A GitHub App under the openotters org with
#      `Contents: Read and write` repository permission.
#   2. The App installed on openotters/homebrew-tap.
#   3. Two secrets on this repo (or the org):
#        - HOMEBREW_TAP_APP_ID          (the App's numeric ID)
#        - HOMEBREW_TAP_APP_PRIVATE_KEY (the .pem file contents)
# A short-lived installation token is minted at runtime by
# actions/create-github-app-token@v1 and passed to goreleaser.
on:
  push:
    tags:
      - 'v*'

permissions:
  # goreleaser creates the GitHub release on this repo.
  contents: write
  # docker images and the helm chart are pushed to ghcr.
  packages: write

jobs:
  # The quality gates, run against the tagged commit itself. A tag can
  # be pushed at any commit (including one that never sat on a green
  # main), so the release proves the checks pass here rather than
  # trusting that they passed somewhere else.
  lint:
    uses: ./.github/workflows/golangci.yml
  test:
    uses: ./.github/workflows/test.yml
  chart:
    uses: ./.github/workflows/chart.yml
  ui:
    uses: ./.github/workflows/ui.yml

  release:
    # Nothing is published unless all four pass: goreleaser writes a
    # GitHub release, pushes images and the chart to ghcr, and updates
    # the homebrew tap, none of which can be taken back cleanly.
    needs: [lint, test, chart, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # goreleaser needs full history for changelog generation.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The web console is embedded into holt via go:embed.
      # GoReleaser's before-hooks run `npm ci && npm run build` under
      # ./cmd/holt/ui and rsync the bundle into cmd/holt/internal/webui/dist
      # before any Go binary is built, so Node must be on the PATH.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: cmd/holt/ui/package-lock.json

      # Multi-arch images: goreleaser builds one image per arch with
      # buildx and assembles the manifest.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint tap App installation token
        id: tap-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          # Restrict the minted token to the tap repo.
          owner: openotters
          repositories: homebrew-tap

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}

      # The chart rides the same tag: chart version == app version,
      # published as an OCI artifact next to the images.
      #   helm install holt oci://ghcr.io/openotters/charts/holt
      - name: Push Helm chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          helm package charts/holt --version "$VERSION" --app-version "$VERSION"
          helm push "holt-$VERSION.tgz" oci://ghcr.io/openotters/charts
