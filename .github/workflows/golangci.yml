name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:
  # Called by the release workflow, so a tag cannot ship past a
  # failing lint.
  workflow_call:

permissions:
  contents: read

jobs:
  golangci:
    strategy:
      matrix:
        go: ['1.26']
        os: [macos-latest, ubuntu-latest]
    name: lint
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Download module dependencies
        run: go mod download
      # golangci-lint is a go.mod tool, so CI runs the exact same
      # version as `task lint` locally.
      - name: golangci-lint
        run: go tool golangci-lint run -c .golangci.yaml ./...
