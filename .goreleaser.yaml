version: 2

project_name: holt

before:
  hooks:
    - go mod tidy
    # The web console is embedded into holt via go:embed
    # (cmd/holt/internal/webui/dist). The committed copy keeps
    # `go install` working, but every release rebuilds the bundle from
    # source under cmd/holt/ui/ so the binary always ships the UI code of the
    # tagged commit.
    #
    # `before.hooks` entries are strings split by shellwords, so each
    # multi-step command goes through `sh -c "..."` to keep `cd` and
    # `&&` working as expected.
    - sh -c "cd cmd/holt/ui && npm ci"
    - sh -c "cd cmd/holt/ui && npm run build"
    - sh -c "rsync -a --delete --exclude=.gitkeep cmd/holt/ui/dist/ cmd/holt/internal/webui/dist/"

builds:
  - id: holt
    main: ./cmd/holt
    binary: holt
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.buildSource=goreleaser

archives:
  - id: all
    ids: [holt]
    name_template: >-
      holt_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files:
      - LICENSE.md
      - README.md

# Docker images, following the tk goreleaser conventions (scratch
# Dockerfile, ghcr, oci labels) extended to multi-arch: one image per
# arch plus a manifest, because the tk single-image pattern is amd64
# only. The Dockerfile only COPYs the prebuilt binary, so cross-arch
# builds need no emulation.
dockers:
  - id: holt-amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - 'ghcr.io/openotters/holt:{{ .Tag }}-amd64'
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.description=Reverse HTTP tunnels for services that can only dial out"
      - "--label=org.opencontainers.image.source=https://github.com/openotters/holt"
  - id: holt-arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - 'ghcr.io/openotters/holt:{{ .Tag }}-arm64'
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.description=Reverse HTTP tunnels for services that can only dial out"
      - "--label=org.opencontainers.image.source=https://github.com/openotters/holt"

docker_manifests:
  - name_template: 'ghcr.io/openotters/holt:{{ .Tag }}'
    image_templates:
      - 'ghcr.io/openotters/holt:{{ .Tag }}-amd64'
      - 'ghcr.io/openotters/holt:{{ .Tag }}-arm64'
  - name_template: 'ghcr.io/openotters/holt:latest'
    image_templates:
      - 'ghcr.io/openotters/holt:{{ .Tag }}-amd64'
      - 'ghcr.io/openotters/holt:{{ .Tag }}-arm64'

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: holt
    repository:
      owner: openotters
      name: homebrew-tap
      # A token with write access on the tap. Set via env in CI or
      # locally (a gh auth token works for a manual release).
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/openotters/holt
    description: "Reverse HTTP tunnel over a single gRPC stream, with a hub CLI and web console"
    license: MIT
    install: |
      bin.install "holt"
    test: |
      assert_match "holt", shell_output("#{bin}/holt --version")
    caveats: |
      🌀  Quick start:

        holt hub --ui                 # run a hub (web console on 127.0.0.1:7201)
        holt enroll web               # mint a join token for a peer
        holt expose localhost:3000 --token <paste>   # expose a local service

      Reach the peer through the hub:

        curl -H 'x-tunnel-peer: web' http://127.0.0.1:7202/

      Hub state (cert, JWT secret, blocklist) lives in ~/.holt

release:
  github:
    owner: openotters
    name: holt
  prerelease: auto
